{% extends 'main/base.html' %} {% block title %}Login{% endblock %} 
{% load crispy_forms_tags %} {% block content %}
<h2 style="text-align: center;">Login</h2>
<form method="post">
  {% csrf_token %}{{form|crispy}}
  <p>Don't have an account? Create one <a href="{% url 'sign_up' %}">Here</a>!</p>
  <p>Forgot password? Reset it <a href="{% url 'password_reset' %}">Reset it here</a>!</p>
  <button type="submit" class="btn btn-success">Login</button>
</form>
{% endblock %}

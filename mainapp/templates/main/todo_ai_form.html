{% extends 'main/base.html' %} {% block title %}OTP{% endblock %} {% block content %}
{% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
{% endif %}
<h1 style="text-align: center">InFlowAI | OTP</h1>
<div class="container">
    <form method="post">
      {%csrf_token%}
        <div class="form-group">
          <label for="project-name">Project name</label>
          <input type="text" class="form-control" id="project-name" name='project-name' placeholder="Project name">
          <p>Your credentials expire in 5 minutes</p>
      </div>
        <div class="form-group">
          <label for="project-prompt">Project prompt</label>
          <textarea class="form-control" id="project-prompt" name='project-prompt' placeholder="Project prompt"></textarea>
      </div>
        {% comment %} <div class="form-group">
          <label for="assistant-prompt">Assistant prompt</label>
          <textarea class="form-control" id="assistant-prompt" name='assistant-prompt' placeholder="Assistant prompt (this is for the ai, when ai response is )"></textarea>
      </div> {% endcomment %}
        <div class="form-group mb-4 text-center">
          <button type="submit" class='btn btn-success'>Register</button>
        </div>
      </form>
    </div>
{% endblock %}

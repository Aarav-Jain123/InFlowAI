{% extends 'main/base.html' %}
{% block title %}Project{% endblock %}
{% block content %}
{% if messages %}
    {% for message in messages %}
    <div class="alert alert-{{ message.tags }} alert-dismissible fade show" role="alert">
        {{ message }}
        <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
    </div>
    {% endfor %}
{% endif %}

<h1 style="text-align: center">Todo</h1>
<div class="container">
    <form method="post">
      {% csrf_token %}
      
      <div class="form-group">
        <label for="project-name">Project name</label>
        <input type="text" class="form-control" id="project-name" name="project-name" placeholder="Project name" required>
      </div>

      <div class="form-group">
        <label for="project-prompt">Project prompt</label>
        <textarea class="form-control" id="project-prompt" name="project-prompt" placeholder="Project prompt" required></textarea>
      </div>

      <div class="form-group mb-4 text-center">
        <!-- Button for AI -->
        <button type="submit" name="action" value="ai" class="btn btn-primary">Send to AI</button>
        <!-- Button for Todo -->
        <button type="submit" name="action" value="todo" class="btn btn-success">Create Todo</button>
      </div>

      {% if response %}
      <div class="form-group mb-4 text-center">
        <pre id="response">{{ response }}</pre>
      </div>
      {% endif %}

    </form>
</div>
{% endblock %}
